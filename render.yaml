services:
  - type: web
    name: debrid-kitaplik
    runtime: node
    plan: free
    rootDir: addon
    buildCommand: "true"
    startCommand: node src/server.js
    healthCheckPath: /health
    envVars:
      - key: ADDON_SECRET
        sync: false
      - key: RD_TOKEN
        sync: false
      - key: AD_KEY
        sync: false
      - key: UPSTASH_REDIS_REST_URL
        sync: false
      - key: UPSTASH_REDIS_REST_TOKEN
        sync: false
